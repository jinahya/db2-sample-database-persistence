services:
  db2:
    image: icr.io/db2_community/db2:latest
    platform: linux/amd64 # no arm64 image; runs under Rosetta/QEMU on Apple Silicon
    container_name: db2-sample-database-persistence
    privileged: true
    ports:
      - "50000:50000"
    restart: always
    environment:
      LICENSE: "accept"
      DB2INSTANCE: "db2inst1"
      DB2INST1_PASSWORD: "abcD1234!"
      SAMPLEDB: "true" # creates the SAMPLE database
      ARCHIVE_LOGS: "false"
      AUTOCONFIG: "false"
      PERSISTENT_HOME: "true"
    volumes:
      - database:/database # named volume; a macOS bind mount breaks useradd/chown during instance creation

  # IBM Db2 Data Management Console (web UI, like pgAdmin) -> https://localhost:11080
  db2console:
    image: icr.io/cpopen/db2console/db2console:latest
    platform: linux/amd64 # x86_64 only
    container_name: db2-sample-database-persistence-console
    user: "0" # image runs as 1001, but a fresh named volume at /mnt is root-owned, so startup fails
    depends_on:
      - db2
    ports:
      - "11080:8443"
    restart: always
    environment:
      LICENSE: "accept"
      ADMIN_NAME: "admin"
      ADMIN_PASSWORD: "abcD1234!"
    volumes:
      - console:/mnt

volumes:
  database:
  console:
